[package]
name = "greentic-setup"
version = "0.5.22"
edition = "2024"
license = "MIT"
rust-version = "1.95"
description = "End-to-end bundle setup engine for the Greentic platform — pack discovery, QA-driven configuration, secrets persistence, and bundle lifecycle management"
repository = "https://github.com/greenticai/greentic-setup"
homepage = "https://github.com/greenticai/greentic-setup"
readme = "README.md"
keywords = ["greentic", "setup", "bundle", "qa", "secrets"]
categories = ["command-line-utilities", "config"]

[[bin]]
name = "greentic-setup"
path = "src/bin/greentic_setup.rs"

[features]
default = ["oci", "squashfs", "ui"]
ui = ["axum", "open", "reqwest"]
oci = ["greentic-distributor-client"]
squashfs = ["backhand"]

[dependencies]
aes-gcm-siv = "0.11"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
backhand = { version = "0.25", optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
greentic-distributor-client = { version = "0.5", default-features = false, features = ["dist-client", "pack-fetch"], optional = true }
greentic-i18n-lib = "0.5"
greentic-runner-host = { version = "0.5", default-features = false }
greentic-secrets-lib = { version = ">=0.5.2, <0.6.0", features = ["providers-dev"] }
greentic-types = { version = "0.5", features = ["serde"] }
flate2 = "1"
hmac = "0.13"
open = { version = "5", optional = true }
qa-spec = "0.5"
rand = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"
tower = "0.5"

[[bench]]
name = "perf"
harness = false
