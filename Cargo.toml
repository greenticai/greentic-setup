[package]
name = "greentic-setup"
version = "1.3.1-dev.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
description = "End-to-end bundle setup engine for the Greentic platform — pack discovery, QA-driven configuration, secrets persistence, and bundle lifecycle management"
repository = "https://github.com/greenticai/greentic-setup"
homepage = "https://github.com/greenticai/greentic-setup"
readme = "README.md"
keywords = ["greentic", "setup", "bundle", "qa", "secrets"]
categories = ["command-line-utilities", "config"]

# cargo-binstall pulls the pre-built binary from the GitHub release tagged
# `v{version}` (produced by release-binaries.yml). Unlike greentic-start,
# greentic-setup has no git/private deps, so its research builds also reach
# crates.io — `cargo binstall greentic-setup` resolves there. This block makes
# the asset URL and archive layout explicit and deterministic instead of relying
# on cargo-binstall's default URL templates.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
# Only the targets release-binaries.yml actually builds. There is no
# x86_64-apple-darwin (Intel-mac) asset, so Intel-mac users fall back to a
# source build; add that triple here if the release matrix gains it.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[features]
default = ["oci", "squashfs", "ui"]
ui = ["axum", "open"]
oci = ["greentic-distributor-client"]
squashfs = ["backhand"]

[dependencies]
aes-gcm-siv = "0.11"
anyhow = "1"
backhand = { version = "0.25", optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
greentic-distributor-client = { version = "=1.3.0-research.1", default-features = false, features = ["dist-client", "pack-fetch"], optional = true }
greentic-i18n = "0.5"
greentic-secrets-lib = { version = "=1.3.0-research.1", features = ["providers-dev"] }
greentic-types = { version = "=1.3.0-research.1", features = ["serde"] }
hmac = "0.13"
qa-spec = "=1.3.0-research.1"
regex = "1"
dialoguer = "0.12"
rpassword = "7"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
axum = { version = "0.8", optional = true }
open = { version = "5", optional = true }
tar = "0.4"
ureq = { version = "3", features = ["json"] }
tracing = "0.1"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[[bin]]
name = "greentic-setup"
path = "src/bin/greentic_setup.rs"

[dev-dependencies]
tempfile = "3"
criterion = "0.8"

[[bench]]
name = "perf"
harness = false
