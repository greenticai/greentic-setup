[package]
name = "greentic-setup"
version = "1.1.30"
edition = "2024"
license = "MIT"
rust-version = "1.95"
description = "End-to-end bundle setup engine for the Greentic platform — pack discovery, QA-driven configuration, secrets persistence, and bundle lifecycle management"
repository = "https://github.com/greenticai/greentic-setup"
homepage = "https://github.com/greenticai/greentic-setup"
readme = "README.md"
keywords = ["greentic", "setup", "bundle", "qa", "secrets"]
categories = ["command-line-utilities", "config"]

[features]
default = ["oci", "squashfs", "ui"]
ui = ["axum", "open", "reqwest"]
oci = ["greentic-distributor-client"]
squashfs = ["backhand"]

[dependencies]
aes-gcm-siv = "0.11"
anyhow = "1"
async-trait = "0.1"
backhand = { version = "0.25", optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
# Floor pinned to the publish that adds the env-aware `manifest_form_spec_for_env`
# (deployer#326): the wizard threads its target env so the `webchat_gui` question
# defaults match the runtime resolver (on for `local`, off elsewhere). That publish
# also carries `ManifestEnvironment.gui_enabled` + the `webchat_gui` question
# (deployer#322) that `manifest_to_answers` maps back for edit-mode pre-fill.
# Floor bumped to 1.1.15 (deployer#459) — a BEHAVIOUR floor, not an API one, so
# the Cargo.lock bump beside it is what actually ships the fix. `env-deploy` is
# the staging step of `gtc start <bundle>` and runs `env_apply::apply` in-process.
# Before 1.1.15 that engine pinned only `packs/` into `pack-list.lock` and never
# scanned `providers/<domain>/`, and `revision_boot` takes its pack paths solely
# from that lock — so a bundle's provider packs reached the runtime not at all
# (webchat GUI 405 on `/v1/web/webchat/{tenant}/`). Nothing failed to compile, so
# only the floor keeps a `--locked` release build off the broken copy.
# Floor raised to 1.1.29 in lockstep with deploy-spec 0.2.5: `env-deploy` stamps
# `EnvironmentHostConfig::default_bundle`, which 0.2.5 adds and which also makes
# the struct `#[non_exhaustive]`; every deployer up to and including the
# published 1.1.28 constructs that struct with literals, so the new spec against
# an older deployer fails inside the registry copy (E0639) rather than with a
# missing-method error. This repo has no direct deploy-spec dependency and
# resolves it transitively through the deployer, so this floor is what protects
# it. 1.1.29, not 1.1.28: main cut and published 1.1.28 from #520 while this
# work was open, so that release predates the conversion.
# Floor raised to 1.1.30: deployer 1.1.30 adds `ManifestEnvironment.default_bundle`
# (deployer#523, closing #521), which the two test-only manifest literals in
# `src/env_wizard.rs` now name. Those literals are exhaustive, so building this
# crate's tests against 1.1.29 fails with E0063. An API floor, not a behaviour
# one — the lib and bin compile against either release.
greentic-deployer = { version = ">=1.1.30, <1.2.0-0", default-features = false }
greentic-distributor-client = { version = ">=1.1.0-dev, <1.2.0-0", default-features = false, features = ["dist-client", "pack-fetch"], optional = true }
# Floor 1.1.6: every publish below it declares `async-nats = "0.46"` NON-optionally, and
# every async-nats 0.46.x hard-pins `rustls-webpki = "0.102"`. Its newest release, 0.102.8,
# carries GHSA-82j2-j2ch-gfr8 (high) and GHSA-pwjx-qhcg-rvj4, and no fixed 0.102.x exists --
# async-nats only moved to the patched 0.103 line in 0.47. `default-features = false` turns
# `agentic-worker` off but does NOT drop async-nats, so this crate was exposed regardless.
# The `-dev` suffix is gone with it: this is a main-lane crate and must not resolve
# develop-lane pre-releases.
greentic-runner-host = { version = ">=1.1.6, <1.2.0-0", default-features = false }
greentic-secrets-lib = { version = ">=1.1.0-dev.27563392344, <1.2.0-0", features = ["providers-dev"] }
# Floor stays 1.1.0: `greentic-session 1.1.1` requires greentic-types `=1.1.2`
# exactly, so raising this to 1.1.4 (for DEFAULT_TENANT / DEFAULT_TEAM) forces
# component-qa, greentic-config{,-types}, greentic-interfaces{,-guest,-host,
# -wasmtime}, greentic-qa-lib, greentic-session and greentic-state down from
# 1.1.1 to 1.1.0. `cli_args.rs` carries a guarded local copy instead.
greentic-types = { version = ">=1.1.0-dev, <1.2.0-0", features = ["serde"] }
hmac = "0.13"
qa-spec = ">=1.1.0-dev.27541005498, <1.2.0-0"
regex = "1"
dialoguer = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
rpassword = "7"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
axum = { version = "0.8", optional = true }
open = { version = "5", optional = true }
tar = "0.4"
ureq = { version = "3", features = ["json"] }
tracing = "0.1"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"

[[bin]]
name = "greentic-setup"
path = "src/bin/greentic_setup.rs"

[dev-dependencies]
criterion = "0.8"
tower = "0.5"

[[bench]]
name = "perf"
harness = false
