[package]
name = "greentic-setup"
version = "1.3.1-research.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
description = "End-to-end bundle setup engine for the Greentic platform — pack discovery, QA-driven configuration, secrets persistence, and bundle lifecycle management"
repository = "https://github.com/greenticai/greentic-setup"
homepage = "https://github.com/greenticai/greentic-setup"
readme = "README.md"
keywords = ["greentic", "setup", "bundle", "qa", "secrets"]
categories = ["command-line-utilities", "config"]

[features]
default = ["oci", "squashfs", "ui"]
ui = ["axum", "open", "reqwest"]
oci = ["greentic-distributor-client"]
squashfs = ["backhand"]

[dependencies]
aes-gcm-siv = "0.11"
anyhow = "1"
async-trait = "0.1"
backhand = { version = "0.25", optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
# Floor re-armed to the deployer 1.1.3-dev publish (deployer#424 re-armed via
# #426, run 28777598365). This is a pre-release-range fix, not a new-surface
# floor: the develop lane moved deployer from the 1.1.2-dev line to 1.1.3-dev to
# escape the stable-1.1.2 shadow, and per cargo's pre-release rule a comparator
# on `1.1.0-dev` cannot match a `1.1.3-dev.*` version — so consumers that pull
# both setup and deployer 1.1.3-dev (e.g. greentic-start) failed to resolve until
# this floor names the 1.1.3-dev line. Still carries the env-aware
# `manifest_form_spec_for_env` (deployer#326) + `ManifestEnvironment.gui_enabled`
# / `webchat_gui` (deployer#322) surfaces the wizard consumes.
#
# Floor bumped to 1.2.0-dev.30561430155: `env_wizard.rs` sets
# `ManifestEnvironment.default_bundle`, which lands on this lane only with the
# forward-port of greentic-deployer#535. An open `>=1.2.0-dev` would let a
# fresh resolve pick an older publish and fail with E0560 on that field.
#
# Moved onto the research line (greentic-start#595): greentic-runner develop
# =-pins the 1.3.0-research family, and this crate depends on runner-host
# directly. 1.3.0-research.1 is the first research deployer carrying the
# develop API above (it exists in git only; see [patch.crates-io]).
greentic-deployer = { version = ">=1.3.0-research.1, <1.4.0-0", default-features = false }
greentic-distributor-client = { version = ">=1.3.0-research.4, <1.4.0-0", default-features = false, features = ["dist-client", "pack-fetch"], optional = true }
greentic-runner-host = { version = ">=1.3.0-research.0, <1.4.0-0", default-features = false }
greentic-secrets-lib = { version = ">=1.3.0-research.3, <1.4.0-0", features = ["providers-dev"] }
greentic-types = { version = ">=1.3.0-research.1, <1.4.0-0", features = ["serde"] }
hmac = "0.13"
qa-spec = ">=1.3.0-research.1, <1.4.0-0"
regex = "1"
dialoguer = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
rpassword = "7"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
axum = { version = "0.8", optional = true }
open = { version = "5", optional = true }
tar = "0.4"
ureq = { version = "3", features = ["json"] }
tracing = "0.1"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"

[[bin]]
name = "greentic-setup"
path = "src/bin/greentic_setup.rs"

[dev-dependencies]
criterion = "0.8"
tower = "0.5"

[[bench]]
name = "perf"
harness = false

# Research-line chain (greentic-start#595). crates.io publishing is locked
# fleet-wide, so the research-line builds this crate needs (each develop's code
# under a never-published number) exist only in git. greentic-secrets-spec and
# greentic-deploy-spec are patched as well because other crates in the graph
# require them from crates.io; without the patch the graph holds two copies. A
# patch section does not travel into a published crate; every consumer carries
# the same set at its own root.
# TO UNWIND once publishing is restored: delete this block, `cargo update`.
[patch.crates-io]
greentic-runner-host = { git = "https://github.com/greenticai/greentic-runner", rev = "85d040b8d56b7d852a6835447f10f23e1f51447c" }
greentic-deployer = { git = "https://github.com/greenticai/greentic-deployer", rev = "a706eea6db1e8f20a5460ea7af0470ff9c53f552" }
greentic-deploy-spec = { git = "https://github.com/greenticai/greentic-deployer", rev = "a706eea6db1e8f20a5460ea7af0470ff9c53f552" }
greentic-update = { git = "https://github.com/greenticai/greentic-update", rev = "b861042120efb1c7f56c0c53ab05f6155f86e1c9" }
greentic-pack-lib = { git = "https://github.com/greenticai/greentic-pack", rev = "46851ce1477c4b440aad7f7e3032260d63f85109" }
greentic-flow = { git = "https://github.com/greenticai/greentic-flow", rev = "348cceb857034ad6533905d747328dca13c1b610" }
greentic-distributor-client = { git = "https://github.com/greenticai/greentic-distributor-client", rev = "d594bb896c9722f439bf3c0cb98a3b85afb9b540" }
greentic-secrets-lib = { git = "https://github.com/greenticai/greentic-secrets", rev = "633934c31a4d0413885bbced87acbc29a03c7b28" }
greentic-secrets-spec = { git = "https://github.com/greenticai/greentic-secrets", rev = "633934c31a4d0413885bbced87acbc29a03c7b28" }
