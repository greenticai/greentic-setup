[package]
name = "greentic-setup"
version = "1.1.1-dev.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
description = "End-to-end bundle setup engine for the Greentic platform — pack discovery, QA-driven configuration, secrets persistence, and bundle lifecycle management"
repository = "https://github.com/greenticai/greentic-setup"
homepage = "https://github.com/greenticai/greentic-setup"
readme = "README.md"
keywords = ["greentic", "setup", "bundle", "qa", "secrets"]
categories = ["command-line-utilities", "config"]

[features]
default = ["oci", "squashfs", "ui"]
ui = ["axum", "open", "reqwest"]
oci = ["greentic-distributor-client"]
squashfs = ["backhand"]

[dependencies]
aes-gcm-siv = "0.11"
anyhow = "1"
async-trait = "0.1"
backhand = { version = "0.25", optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
# Floor re-armed to the deployer 1.1.3-dev publish (deployer#424 re-armed via
# #426, run 28777598365). This is a pre-release-range fix, not a new-surface
# floor: the develop lane moved deployer from the 1.1.2-dev line to 1.1.3-dev to
# escape the stable-1.1.2 shadow, and per cargo's pre-release rule a comparator
# on `1.1.0-dev` cannot match a `1.1.3-dev.*` version — so consumers that pull
# both setup and deployer 1.1.3-dev (e.g. greentic-start) failed to resolve until
# this floor names the 1.1.3-dev line. Still carries the env-aware
# `manifest_form_spec_for_env` (deployer#326) + `ManifestEnvironment.gui_enabled`
# / `webchat_gui` (deployer#322) surfaces the wizard consumes.
greentic-deployer = { version = ">=1.1.3-dev.28777598365, <1.2.0-0", default-features = false }
greentic-distributor-client = { version = ">=1.1.0-dev, <1.2.0-0", default-features = false, features = ["dist-client", "pack-fetch"], optional = true }
greentic-runner-host = { version = ">=1.1.0-dev, <1.2.0-0", default-features = false }
greentic-secrets-lib = { version = ">=1.1.0-dev.27563392344, <1.2.0-0", features = ["providers-dev"] }
greentic-types = { version = ">=1.1.0-dev, <1.2.0-0", features = ["serde"] }
hmac = "0.13"
qa-spec = ">=1.1.0-dev.27541005498, <1.2.0-0"
regex = "1"
dialoguer = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
rpassword = "7"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
axum = { version = "0.8", optional = true }
open = { version = "5", optional = true }
tar = "0.4"
ureq = { version = "3", features = ["json"] }
tracing = "0.1"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[[bin]]
name = "greentic-setup"
path = "src/bin/greentic_setup.rs"

[dev-dependencies]
tempfile = "3"
criterion = "0.8"
tower = "0.5"

[[bench]]
name = "perf"
harness = false
